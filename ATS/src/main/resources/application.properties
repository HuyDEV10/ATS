# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

resume.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ==============================
# Spring AI / OpenAI
# ==============================
# Default để app vẫn chạy nếu chưa bật AI thật.
# Khi muốn dùng Spring AI thật, set:
# ATS_AI_PROVIDER=spring-ai
# SPRING_AI_MODEL_CHAT=openai
# OPENAI_API_KEY=...
ats.ai.provider=${ATS_AI_PROVIDER:noop}

# Spring AI model routing.
# Để none mặc định giúp app không fail khi dev chưa có key.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}

# OpenAI config
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.2}
# AI provider switch
# Use ATS_AI_PROVIDER=spring-ai when SpringAiClient is configured; default keeps rule-based/noop fallback.

