<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Việc làm đang tuyển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <h2>Việc làm đang tuyển</h2>

        <div class="row">
            <div class="col-md-4 mb-3" th:each="job : ${jobs}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 th:text="${job.title}"></h5>
                        <p th:text="${job.location}"></p>
                        <p th:text="${job.salaryRange}"></p>

                        <a th:href="@{/public/jobs/{id}(id=${job.id})}" class="btn btn-primary">
                            Xem và ứng tuyển
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
