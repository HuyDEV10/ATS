<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${job.title} + ' - SmartATS'">Job Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div th:if="${success}" class="alert alert-success" th:text="${success}">
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        </div>

        <a href="/careers" class="text-decoration-none">
            ← Quay lại danh sách việc làm
        </a>

        <div class="card border-0 shadow-sm rounded-4 mt-3">

            <div class="card-body p-5">

                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">

                    <div>
                        <h1 class="fw-bold" th:text="${job.title}">
                            Java Developer
                        </h1>

                        <h5 class="text-primary" th:text="${company != null ? company.name : 'Company'}">
                            Company
                        </h5>

                        <p class="text-muted mb-0">
                            <span th:text="${job.department}">IT</span>
                            ·
                            <span th:text="${job.location}">Đà Nẵng</span>
                        </p>
                    </div>

                    <a th:href="@{/careers/{id}/apply(id=${job.id})}" class="btn btn-primary btn-lg">
                        Apply Now
                    </a>

                </div>

                <hr class="my-4">

                <div class="row mb-4">

                    <div class="col-md-4">
                        <div class="text-muted">Mức lương</div>
                        <div class="fw-bold text-success" th:text="${job.salaryRange}">
                            15M - 30M
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="text-muted">Công ty</div>
                        <div class="fw-bold" th:text="${company != null ? company.name : 'N/A'}">
                            Company
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="text-muted">Website</div>

                        <a th:if="${company != null}" th:href="${company.website}" th:text="${company.website}">
                            Website
                        </a>
                    </div>

                </div>

                <h4 class="fw-bold">
                    Mô tả công việc
                </h4>

                <div class="bg-light rounded-3 p-4" style="white-space: pre-line" th:text="${job.description}">
                    Job description
                </div>

                <h4 class="fw-bold mt-4">
                    Thông tin công ty
                </h4>

                <div class="bg-light rounded-3 p-4" style="white-space: pre-line"
                    th:text="${company != null ? company.description : 'Chưa cập nhật'}">
                    Company description
                </div>

            </div>

        </div>

    </div>

</body>

</html>
