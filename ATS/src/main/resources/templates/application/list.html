<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý Đơn ứng tuyển - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.04),
                    rgba(13, 202, 240, 0.03)),
                #f4f7fb;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            border-radius: 24px;
            padding: 32px;
            color: white;
            box-shadow: 0 18px 40px rgba(13, 110, 253, 0.18);
        }

        .page-header h2 {
            font-weight: 800;
            margin-bottom: 10px;
        }

        .page-header p {
            margin-bottom: 0;
            opacity: 0.92;
        }

        .main-card {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.06);
        }

        .filter-section {
            background: white;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }

        .form-label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 10px;
        }

        .form-select,
        .form-control {
            border-radius: 14px;
            min-height: 48px;
            border: 1px solid #dbe2ea;
            transition: all 0.2s ease;
        }

        .form-select:focus,
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: #f8fafc;
        }

        .table thead th {
            border: none;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            padding-top: 18px;
            padding-bottom: 18px;
        }

        .table tbody td {
            vertical-align: middle;
            padding-top: 18px;
            padding-bottom: 18px;
            border-color: #f1f5f9;
        }

        .table-hover tbody tr:hover {
            background-color: #f8fbff;
        }

        .status-badge {
            min-width: 140px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .btn {
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-dark {
            border: none;
        }

        .quick-status-form .form-select {
            min-height: 38px;
            border-radius: 10px;
            font-size: 13px;
        }

        .quick-status-form .btn {
            height: 38px;
            border-radius: 10px;
        }

        .action-buttons .btn {
            width: 38px;
            height: 38px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination .page-link {
            border: none;
            margin: 0 4px;
            border-radius: 10px;
            color: #0d6efd;
            min-width: 40px;
            text-align: center;
        }

        .pagination .active .page-link {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
        }

        .bottom-links a {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container-fluid py-4 px-4">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4"
            role="alert">

            <i class="bi bi-check-circle-fill me-2"></i>

            <span th:text="${success}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

        </div>

        <div class="page-header mb-4">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>

                    <h2>
                        <i class="bi bi-clipboard-data me-2"></i>
                        Danh sách Đơn ứng tuyển
                    </h2>

                    <p>
                        Theo dõi trạng thái tuyển dụng và quản lý quy trình ứng tuyển.
                    </p>

                </div>

                <a href="/applications/create" class="btn btn-light px-4 py-2 fw-bold">

                    <i class="bi bi-plus-lg"></i>
                    Tạo đơn mới

                </a>

            </div>

        </div>

        <div class="filter-section mb-4">

            <form method="get" class="row g-3 align-items-end">

                <div class="col-md-3">

                    <label class="form-label">
                        Vị trí công việc
                    </label>

                    <select name="jobId" class="form-select">

                        <option value="">
                            Tất cả Job
                        </option>

                        <option th:each="j : ${jobs}" th:value="${j.id}" th:text="${j.title}"
                            th:selected="${jobId == j.id}">
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Ứng viên
                    </label>

                    <select name="candidateId" class="form-select">

                        <option value="">
                            Tất cả ứng viên
                        </option>

                        <option th:each="c : ${candidates}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${candidateId == c.id}">
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Trạng thái
                    </label>

                    <select name="status" class="form-select">

                        <option value="">
                            Tất cả trạng thái
                        </option>

                        <option value="PENDING" th:selected="${status == 'PENDING'}">
                            PENDING
                        </option>

                        <option value="AI_SCREENED" th:selected="${status == 'AI_SCREENED'}">
                            AI_SCREENED
                        </option>

                        <option value="SHORTLISTED" th:selected="${status == 'SHORTLISTED'}">
                            SHORTLISTED
                        </option>

                        <option value="INTERVIEW_SCHEDULED" th:selected="${status == 'INTERVIEW_SCHEDULED'}">
                            INTERVIEW_SCHEDULED
                        </option>

                        <option value="INTERVIEWED" th:selected="${status == 'INTERVIEWED'}">
                            INTERVIEWED
                        </option>

                        <option value="OFFERED" th:selected="${status == 'OFFERED'}">
                            OFFERED
                        </option>

                        <option value="REJECTED" th:selected="${status == 'REJECTED'}">
                            REJECTED
                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <button type="submit" class="btn btn-dark w-100 py-3">

                        <i class="bi bi-filter"></i>
                        Lọc kết quả

                    </button>

                </div>

            </form>

        </div>

        <div class="card main-card">

            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th class="ps-4">ID</th>

                                <th>Thông tin đơn</th>

                                <th class="text-center">Trạng thái</th>

                                <th>Ngày ứng tuyển</th>

                                <th class="text-center">Thao tác nhanh</th>

                                <th class="text-center pe-4">Quản lý</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="app : ${appPage.records}">

                                <td class="ps-4 text-muted small" th:text="${app.id}">
                                </td>

                                <td>

                                    <div class="fw-bold" th:text="'Job ID: ' + ${app.jobId}">
                                    </div>

                                    <div class="small text-muted" th:text="'Candidate ID: ' + ${app.candidateId}">
                                    </div>

                                </td>

                                <td class="text-center">

                                    <span
                                        th:classappend="${app.status == 'OFFERED' ? 'bg-success' : (app.status == 'REJECTED' ? 'bg-danger' : (app.status == 'INTERVIEW_SCHEDULED' ? 'bg-info text-dark' : 'bg-warning text-dark'))}"
                                        class="badge status-badge" th:text="${app.status}">
                                    </span>

                                </td>

                                <td th:text="${#temporals.format(app.applicationDate, 'dd/MM/yyyy')}">
                                </td>

                                <td class="text-center">

                                    <form th:action="@{/applications/change-status/{id}(id=${app.id})}" method="post"
                                        class="row g-1 justify-content-center quick-status-form">

                                        <div class="col-auto">

                                            <select name="status" class="form-select form-select-sm"
                                                style="width: 150px;">

                                                <option value="PENDING">PENDING</option>
                                                <option value="AI_SCREENED">AI_SCREENED</option>
                                                <option value="SHORTLISTED">SHORTLISTED</option>
                                                <option value="INTERVIEW_SCHEDULED">INTERVIEW_SCHEDULED</option>
                                                <option value="INTERVIEWED">INTERVIEWED</option>
                                                <option value="OFFERED">OFFERED</option>
                                                <option value="REJECTED">REJECTED</option>

                                            </select>

                                        </div>

                                        <div class="col-auto">

                                            <button type="submit" class="btn btn-sm btn-primary px-3">

                                                OK

                                            </button>

                                        </div>

                                    </form>

                                </td>

                                <td class="text-center pe-4">

                                    <div class="btn-group action-buttons">

                                        <a th:href="@{/applications/view/{id}(id=${app.id})}"
                                            class="btn btn-outline-secondary btn-sm" title="Chi tiết">

                                            <i class="bi bi-eye"></i>

                                        </a>

                                        <a th:href="@{/applications/edit/{id}(id=${app.id})}"
                                            class="btn btn-outline-warning btn-sm" title="Sửa">

                                            <i class="bi bi-pencil"></i>

                                        </a>

                                        <a th:href="@{/applications/delete/{id}(id=${app.id})}"
                                            class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('Xóa đơn này?')" title="Xóa">

                                            <i class="bi bi-trash"></i>

                                        </a>

                                    </div>

                                </td>

                            </tr>

                            <tr th:if="${appPage.records.isEmpty()}">

                                <td colspan="6" class="text-center py-5 text-muted">

                                    Không tìm thấy đơn ứng tuyển nào.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <nav th:if="${appPage.pages > 1}" class="mt-4">

            <ul class="pagination justify-content-center">

                <li class="page-item" th:each="i: ${#numbers.sequence(1, appPage.pages)}"
                    th:classappend="${i == appPage.current} ? 'active'">

                    <a class="page-link"
                        th:href="@{/applications(page=${i}, size=${appPage.size}, jobId=${jobId}, candidateId=${candidateId}, status=${status})}"
                        th:text="${i}">
                    </a>

                </li>

            </ul>

        </nav>

        <div class="mt-4 text-center bottom-links">

            <a href="/jobs" class="btn btn-link text-decoration-none">

                Công việc

            </a>

            <span class="text-muted">|</span>

            <a href="/candidates" class="btn btn-link text-decoration-none">

                Ứng viên

            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
