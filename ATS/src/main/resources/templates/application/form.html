<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.05),
                    rgba(13, 202, 240, 0.04)),
                #f4f7fb;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 760px;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .application-card {
            border: none;
            border-radius: 24px;
            overflow: hidden;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            padding: 36px 40px;
        }

        .card-header-custom h2 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .card-header-custom p {
            margin-bottom: 0;
            opacity: 0.92;
            font-size: 15px;
        }

        .card-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            min-height: 50px;
            border: 1px solid #dbe2ea;
            padding-left: 14px;
            transition: all 0.2s ease;
        }

        textarea.form-control {
            min-height: 120px;
            padding-top: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .input-group-text {
            border-radius: 14px 0 0 14px;
            border: 1px solid #dbe2ea;
            background: #f8fafc;
            color: #0d6efd;
            font-size: 18px;
        }

        .status-section {
            background: #fff8e7;
            border: 1px dashed #ffc107;
            border-radius: 18px;
            padding: 22px;
        }

        .status-section .form-select {
            border-color: #ffc107;
        }

        .btn-submit {
            height: 52px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(13, 110, 253, 0.22);
        }

        .btn-outline-secondary {
            border-radius: 14px;
            height: 50px;
            font-weight: 600;
        }

        .form-text {
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .card-header-custom {
                padding: 28px;
            }

            .card-body {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card application-card">

            <div class="card-header-custom">

                <h2>
                    <i class="bi bi-file-earmark-person me-2"></i>

                    <span th:if="${application.id == null}">
                        Tạo Đơn Ứng Tuyển
                    </span>

                    <span th:if="${application.id != null}">
                        Cập Nhật Trạng Thái
                    </span>
                </h2>

                <p>
                    Quản lý quy trình tuyển dụng và theo dõi trạng thái ứng viên
                    trên hệ thống SmartATS.
                </p>

            </div>

            <div class="card-body">

                <form
                    th:action="${application.id == null ? '/applications/create' : '/applications/edit/' + application.id}"
                    th:method="post" th:object="${application}">

                    <div class="mb-4">

                        <label class="form-label">
                            Vị trí tuyển dụng
                            <span class="text-danger">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-briefcase"></i>
                            </span>

                            <select th:field="*{jobId}" class="form-select" required>

                                <option value="">
                                    -- Chọn vị trí cần tuyển --
                                </option>

                                <option th:each="j : ${jobs}" th:value="${j.id}" th:text="${j.title}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Ứng viên
                            <span class="text-danger">*</span>
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <select th:field="*{candidateId}" class="form-select" required>

                                <option value="">
                                    -- Chọn ứng viên ứng tuyển --
                                </option>

                                <option th:each="c : ${candidates}" th:value="${c.id}" th:text="${c.name}">
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-4 status-section" th:if="${application.id != null}">

                        <label class="form-label text-dark">
                            <i class="bi bi-gear-fill me-1"></i>
                            Trạng thái xét duyệt
                        </label>

                        <select th:field="*{status}" class="form-select">

                            <option value="PENDING">
                                PENDING (Chờ duyệt)
                            </option>

                            <option value="AI_SCREENED">
                                AI_SCREENED (AI đã lọc hồ sơ)
                            </option>

                            <option value="SHORTLISTED">
                                SHORTLISTED (Danh sách rút gọn)
                            </option>

                            <option value="INTERVIEW_SCHEDULED">
                                INTERVIEW_SCHEDULED (Đã lên lịch phỏng vấn)
                            </option>

                            <option value="INTERVIEWED">
                                INTERVIEWED (Đã phỏng vấn)
                            </option>

                            <option value="OFFERED">
                                OFFERED (Mời làm việc)
                            </option>

                            <option value="REJECTED">
                                REJECTED (Từ chối)
                            </option>

                        </select>

                        <div class="form-text mt-2 text-muted">
                            Thay đổi trạng thái để cập nhật tiến độ tuyển dụng.
                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Ghi chú của HR (HR Notes)
                        </label>

                        <textarea th:field="*{hrNotes}" class="form-control" rows="4"
                            placeholder="Nhận xét sơ bộ về ứng viên, lịch hẹn phỏng vấn..."></textarea>

                    </div>

                    <div class="d-grid gap-3">

                        <button type="submit" class="btn btn-primary btn-submit">

                            <i class="bi bi-check2-circle me-1"></i>

                            <span th:text="${application.id == null ? 'Gửi Đơn Ứng Tuyển' : 'Cập Nhật Đơn'}">
                            </span>

                        </button>

                        <a href="/applications" class="btn btn-outline-secondary">

                            Quay lại danh sách

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
