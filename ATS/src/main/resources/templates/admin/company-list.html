<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Companies - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <h2 class="mb-4">Company Management</h2>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form method="get" class="row g-2 mb-3">
            <div class="col-md-4">
                <input class="form-control" name="keyword" th:value="${keyword}"
                    placeholder="Search company or industry">
            </div>
            <div class="col-md-3">
                <select class="form-select" name="status">
                    <option value="">All status</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">PENDING</option>
                    <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
                    <option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">SUSPENDED</option>
                    <option value="REJECTED" th:selected="${status == 'REJECTED'}">REJECTED</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-dark w-100" type="submit">Search</button>
            </div>
        </form>

        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Company</th>
                    <th>Industry</th>
                    <th>Size</th>
                    <th>Status</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="company : ${companyPage.records}">
                    <td th:text="${company.id}"></td>
                    <td>
                        <strong th:text="${company.name}"></strong><br>
                        <small th:text="${company.website}"></small>
                    </td>
                    <td th:text="${company.industry}"></td>
                    <td th:text="${company.companySize}"></td>
                    <td>
                        <span class="badge bg-secondary" th:text="${company.status}"></span>
                    </td>
                    <td class="text-center">
                        <a class="btn btn-sm btn-primary" th:href="@{/admin/companies/{id}(id=${company.id})}">View</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${companyPage.pages > 1}">
            <ul class="pagination">
                <li class="page-item" th:each="i: ${#numbers.sequence(1, companyPage.pages)}"
                    th:classappend="${i == companyPage.current} ? 'active'">
                    <a class="page-link"
                        th:href="@{/admin/companies(page=${i}, size=${companyPage.size}, keyword=${keyword}, status=${status})}"
                        th:text="${i}"></a>
                </li>
            </ul>
        </nav>
    </div>
</body>

</html>
