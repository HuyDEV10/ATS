<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Company Detail - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <a href="/admin/companies" class="btn btn-link mb-3">&larr; Back</a>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="card">
            <div class="card-body">
                <h2 th:text="${company.name}">Company name</h2>
                <p><strong>Status:</strong> <span class="badge bg-secondary" th:text="${company.status}"></span></p>
                <p><strong>Industry:</strong> <span th:text="${company.industry}"></span></p>
                <p><strong>Company size:</strong> <span th:text="${company.companySize}"></span></p>
                <p><strong>Website:</strong> <span th:text="${company.website}"></span></p>
                <p><strong>Address:</strong> <span th:text="${company.address}"></span></p>

                <div class="d-flex gap-2 mt-4">
                    <form th:action="@{/admin/companies/{id}/approve(id=${company.id})}" method="post">
                        <button class="btn btn-success" type="submit">Approve</button>
                    </form>
                    <form th:action="@{/admin/companies/{id}/suspend(id=${company.id})}" method="post">
                        <button class="btn btn-warning" type="submit">Suspend</button>
                    </form>
                    <form th:action="@{/admin/companies/{id}/reject(id=${company.id})}" method="post">
                        <button class="btn btn-danger" type="submit">Reject</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
