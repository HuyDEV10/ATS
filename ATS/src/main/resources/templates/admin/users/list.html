<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quản lý người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Quản lý người dùng</h2>
            <a href="/admin/users/create" class="btn btn-primary">Tạo user</a>
        </div>

        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Đổi role</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>

                    <td>
                        <form th:action="@{/admin/users/change-role/{id}(id=${user.id})}" method="post"
                            class="d-flex gap-2">
                            <select name="role" class="form-select form-select-sm">
                                <option value="ADMIN">ADMIN</option>
                                <option value="HR">HR</option>
                                <option value="INTERVIEWER">INTERVIEWER</option>
                            </select>
                            <button class="btn btn-sm btn-warning">Lưu</button>
                        </form>
                    </td>

                    <td>
                        <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('Xóa user này?')">
                            Xóa
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</body>

</html>
