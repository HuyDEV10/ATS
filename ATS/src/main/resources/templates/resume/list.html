<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách hồ sơ (Resumes) - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .table thead {
            background-color: #f1f3f5;
        }

        .status-badge {
            width: 100px;
            display: inline-block;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4 px-4">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card main-card">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="h3 fw-bold text-dark mb-1">Quản lý hồ sơ ứng viên (Resumes)</h2>
                        <p class="text-muted small mb-0">Theo dõi trạng thái bóc tách dữ liệu CV/Resume của hệ thống</p>
                    </div>
                    <a href="/resumes/upload" class="btn btn-primary px-4 shadow-sm">
                        <i class="bi bi-upload me-1"></i> Upload CV Mới
                    </a>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <form method="get" class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-search text-muted"></i></span>
                            <input type="text" name="keyword" class="form-control border-start-0" th:value="${keyword}"
                                placeholder="Tìm kiếm theo tên file..." />
                            <button class="btn btn-dark" type="submit">Search</button>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th class="text-muted small fw-semibold">ID</th>
                                <th class="fw-semibold"><i class="bi bi-file-earmark-text me-1"></i> Tên file</th>
                                <th class="fw-semibold"><i class="bi bi-calendar-event me-1"></i> Thời gian upload</th>
                                <th class="fw-semibold text-center">Trạng thái xử lý</th>
                                <th class="fw-semibold text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${resumePage.records}">
                                <td th:text="${r.id}" class="text-muted small">1</td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${r.fileName}">resume.pdf</span>
                                </td>
                                <td>
                                    <span
                                        th:text="${#temporals.format(r.uploadTime, 'dd/MM/yyyy HH:mm')} ?: ${r.uploadTime}"></span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${r.parseStatus == 'COMPLETED'}"
                                        class="badge bg-success-subtle text-success border border-success status-badge">COMPLETED</span>
                                    <span th:if="${r.parseStatus == 'PENDING'}"
                                        class="badge bg-warning-subtle text-warning border border-warning status-badge text-dark">PENDING</span>
                                    <span th:if="${r.parseStatus == 'FAILED'}"
                                        class="badge bg-danger-subtle text-danger border border-danger status-badge text-dark">FAILED</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group shadow-sm border rounded">
                                        <a th:href="@{/resumes/view/{id}(id=${r.id})}"
                                            class="btn btn-sm btn-light text-primary" title="Xem chi tiết"><i
                                                class="bi bi-eye"></i></a>
                                        <a th:href="@{/resumes/delete/{id}(id=${r.id})}"
                                            class="btn btn-sm btn-light text-danger" title="Xóa"
                                            onclick="return confirm('Bạn có chắc chắn muốn xóa hồ sơ này?')"><i
                                                class="bi bi-trash"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${resumePage.records.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-folder-x display-4 d-block mb-2"></i>
                                    Không tìm thấy hồ sơ nào.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${resumePage.pages > 1}" aria-label="Page navigation" class="mt-4">
                    <ul class="pagination pagination-sm justify-content-center">
                        <li class="page-item" th:each="i: ${#numbers.sequence(1, resumePage.pages)}"
                            th:classappend="${i == resumePage.current} ? 'active'">
                            <a class="page-link"
                                th:href="@{/resumes(page=${i}, size=${resumePage.size}, keyword=${keyword})}"
                                th:text="${i}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="/home" class="btn btn-link text-decoration-none text-muted">
                <i class="bi bi-house-door me-1"></i> Quay lại trang chủ
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
