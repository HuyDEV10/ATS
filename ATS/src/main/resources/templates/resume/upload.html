<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải lên hồ sơ (Upload Resume) - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7f6;
        }

        .container {
            max-width: 600px;
            margin-top: 5rem;
            margin-bottom: 3rem;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #0d6efd;
            border-radius: 15px;
            padding: 3rem 1.5rem;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background-color: #eef4ff;
            border-color: #084298;
        }

        .upload-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="card-body p-5 text-center">

                <div class="mb-4">
                    <h2 class="fw-bold text-dark">
                        <i class="bi bi-cloud-arrow-up-fill text-primary me-2"></i> Tải lên Hồ sơ
                    </h2>
                    <p class="text-muted small">Hỗ trợ các định dạng PDF, DOC, DOCX. Hệ thống sẽ tự động bóc tách dữ
                        liệu AI.</p>
                </div>

                <form method="post" enctype="multipart/form-data" th:action="@{/resumes/upload}">

                    <label for="formFile" class="upload-area d-block mb-4">
                        <i class="bi bi-file-earmark-arrow-up upload-icon mb-3 d-block"></i>
                        <span class="d-block fw-semibold text-primary mb-1">Nhấn để chọn file hoặc kéo thả vào
                            đây</span>
                        <span class="d-block text-muted small">Tối đa 10MB</span>
                    </label>
                    <input class="d-none" type="file" id="formFile" name="file" accept=".pdf,.doc,.docx" required />

                    <div id="fileNameDisplay" class="mb-4 text-success fw-bold small"></div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-upload me-1"></i> Tải hồ sơ lên
                        </button>
                        <a href="/resumes" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fileInput = document.getElementById('formFile');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        fileInput.addEventListener('change', function () {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = `Đã chọn: ${fileInput.files[0].name}`;
            } else {
                fileNameDisplay.textContent = '';
            }
        });
    </script>
</body>

</html>
