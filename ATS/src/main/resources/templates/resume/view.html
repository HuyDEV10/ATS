<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Hồ sơ - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .main-container {
            max-width: 800px;
            padding-top: 3rem;
            padding-bottom: 3rem;
        }

        .detail-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .header-banner {
            background: linear-gradient(135deg, #0d6efd, #033984);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 2rem;
        }

        .info-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #212529;
            margin-bottom: 1.5rem;
        }

        .code-block {
            background-color: #f8f9fa;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #dee2e6;
        }
    </style>
</head>

<body>

    <div class="container main-container">
        <div class="mb-4">
            <a href="/resumes" class="btn btn-link text-decoration-none text-muted p-0">
                <i class="bi bi-arrow-left"></i> Quay lại danh sách hồ sơ
            </a>
        </div>

        <div class="card detail-card">
            <div class="header-banner d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 fw-bold mb-1"><i class="bi bi-file-earmark-richtext me-2"></i> Chi tiết Hồ sơ</h1>
                    <p class="mb-0 text-white-50">Mã định danh: #<span th:text="${resume.id}">ID</span></p>
                </div>
                <span th:if="${resume.parseStatus == 'COMPLETED'}"
                    class="badge bg-success fs-6 px-3 py-2 shadow-sm">COMPLETED</span>
                <span th:if="${resume.parseStatus == 'PENDING'}"
                    class="badge bg-warning text-dark fs-6 px-3 py-2 shadow-sm">PENDING</span>
                <span th:if="${resume.parseStatus == 'FAILED'}"
                    class="badge bg-danger fs-6 px-3 py-2 shadow-sm">FAILED</span>
            </div>

            <div class="card-body p-4 p-md-5 bg-white rounded-bottom">
                <div class="row">
                    <div class="col-md-6">
                        <div class="info-label">Tên file</div>
                        <div class="info-value text-primary fw-bold" th:text="${resume.fileName}">resume.pdf</div>

                        <div class="info-label">Đường dẫn lưu trữ (File Path)</div>
                        <div class="info-value code-block" th:text="${resume.filePath ?: 'N/A'}">/uploads/...</div>

                        <div class="info-label">File Hash (MD5)</div>
                        <div class="info-value code-block text-truncate" style="max-width: 320px;"
                            th:text="${resume.fileHash ?: 'N/A'}">d41d8cd98f00b204e9800998ecf8427e</div>
                    </div>

                    <div class="col-md-6 border-start ps-md-4">
                        <div class="info-label">Người tải lên</div>
                        <div class="info-value"><i class="bi bi-person me-1"></i> <span
                                th:text="${resume.uploadedBy}">Admin</span></div>

                        <div class="info-label">Thời gian tải lên</div>
                        <div class="info-value"><i class="bi bi-clock me-1"></i> <span
                                th:text="${#temporals.format(resume.uploadTime, 'dd/MM/yyyy HH:mm')} ?: ${resume.uploadTime}">Time</span>
                        </div>
                    </div>
                </div>

                <div class="mt-5 pt-4 border-top text-end">
                    <button class="btn btn-outline-primary" onclick="window.print()">
                        <i class="bi bi-printer me-1"></i> In chi tiết
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
