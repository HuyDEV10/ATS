<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Form - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }

        .container {
            max-width: 750px;
            margin-top: 3rem;
            margin-bottom: 3rem;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 600;
            color: #344767;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4 fw-bold text-primary">
                    <span th:if="${job.id == null}">Tạo Công Việc Mới</span>
                    <span th:if="${job.id != null}">Chỉnh Sửa Công Việc</span>
                </h2>

                <form th:action="${job.id == null ? '/jobs/create' : '/jobs/edit/' + job.id}" th:method="post"
                    th:object="${job}">

                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="form-label">Tiêu đề công việc</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                placeholder="Ví dụ: Senior Java Developer" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phòng ban</label>
                            <input type="text" th:field="*{department}" class="form-control"
                                placeholder="IT, HR, Marketing..." />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Địa điểm</label>
                            <input type="text" th:field="*{location}" class="form-control"
                                placeholder="Hà Nội, Đà Nẵng..." />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mức lương</label>
                            <input type="text" th:field="*{salaryRange}" class="form-control" placeholder="15M - 30M" />
                        </div>

                        <div class="col-md-6 mb-3" th:if="${job.id != null}">
                            <label class="form-label">Trạng thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="DRAFT">DRAFT</option>
                                <option value="PUBLISHED">PUBLISHED</option>
                                <option value="CLOSED">CLOSED</option>
                            </select>
                        </div>

                        <div class="col-12 mb-4">
                            <label class="form-label">Mô tả công việc</label>
                            <textarea th:field="*{description}" class="form-control" rows="5"
                                placeholder="Nhập chi tiết yêu cầu công việc..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4 shadow-sm">
                            <span th:text="${job.id == null ? 'Lưu Công Việc' : 'Cập Nhật'}"></span>
                        </button>
                        <a href="/jobs" class="btn btn-outline-secondary px-4">Quay lại</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
