<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <h2>Admin Dashboard</h2>

        <div class="row g-3 mt-3">

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Total Jobs</h5>
                    <h2 th:text="${stats.totalJobs}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Total Candidates</h5>
                    <h2 th:text="${stats.totalCandidates}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Total Applications</h5>
                    <h2 th:text="${stats.totalApplications}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Total Interviews</h5>
                    <h2 th:text="${stats.totalInterviews}"></h2>
                </div>
            </div>

        </div>

        <div class="mt-4 d-flex gap-2">
            <a href="/admin/users" class="btn btn-primary">Quản lý user</a>
            <a href="/jobs" class="btn btn-secondary">Quản lý job</a>
            <a href="/applications" class="btn btn-secondary">Applications</a>
        </div>

    </div>
</body>

</html>
