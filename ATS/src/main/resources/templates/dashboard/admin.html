<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3748;
        }

        .dashboard-wrapper {
            min-height: 100vh;
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: #fff;
            border-radius: 18px;
            padding: 28px 32px;
            box-shadow: 0 12px 30px rgba(13, 110, 253, 0.18);
        }

        .page-header h2 {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header p {
            margin-bottom: 0;
            opacity: 0.9;
        }

        .stat-card {
            border: none;
            border-radius: 18px;
            padding: 24px 20px;
            background: #fff;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.1);
        }

        .stat-card h5 {
            color: #718096;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            color: #0d6efd;
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 0;
        }

        .action-panel {
            background: #fff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
        }

        .action-panel .btn {
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container py-4 dashboard-wrapper">

        <div class="page-header">
            <h2>Admin Dashboard</h2>
            <p>Tổng quan hệ thống tuyển dụng ATS</p>
        </div>

        <div class="row g-3 mt-3">

            <div class="col-md-4">
                <div class="card stat-card text-center">
                    <h5>Total Jobs</h5>
                    <h2 th:text="${stats.totalJobs}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card text-center">
                    <h5>Total Candidates</h5>
                    <h2 th:text="${stats.totalCandidates}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card text-center">
                    <h5>Total Applications</h5>
                    <h2 th:text="${stats.totalApplications}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card text-center">
                    <h5>Total Interviews</h5>
                    <h2 th:text="${stats.totalInterviews}"></h2>
                </div>
            </div>

        </div>

        <div class="mt-4 action-panel d-flex gap-2 flex-wrap">
            <a href="/admin/users" class="btn btn-primary">Quản lý user</a>
            <a href="/jobs" class="btn btn-outline-secondary">Quản lý job</a>
            <a href="/applications" class="btn btn-outline-secondary">Applications</a>
        </div>

    </div>
</body>

</html>
