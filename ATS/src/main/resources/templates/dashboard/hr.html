<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>HR Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3748;
        }

        .dashboard-wrapper {
            min-height: 100vh;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #198754, #37b36b);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 12px 30px rgba(25, 135, 84, 0.2);
        }

        .dashboard-header h2 {
            font-weight: 700;
            margin-bottom: 6px;
        }

        .dashboard-header p {
            margin-bottom: 0;
            opacity: 0.9;
        }

        .stat-card {
            background: #fff;
            border: none;
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.1);
        }

        .stat-card h5 {
            font-size: 15px;
            color: #718096;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .stat-card h2 {
            font-size: 36px;
            font-weight: 800;
            color: #198754;
            margin-bottom: 0;
        }

        .action-panel {
            background: white;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
        }

        .action-panel .btn {
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container py-4 dashboard-wrapper">

        <div class="dashboard-header">
            <h2>HR Dashboard</h2>
            <p>Quản lý tuyển dụng, ứng viên và quy trình phỏng vấn</p>
        </div>

        <div class="row g-4 mt-2">

            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>Jobs</h5>
                    <h2 th:text="${stats.totalJobs}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>Candidates</h5>
                    <h2 th:text="${stats.totalCandidates}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>Pending Applications</h5>
                    <h2 th:text="${stats.pendingApplications}"></h2>
                </div>
            </div>

        </div>

        <div class="mt-4 action-panel d-flex gap-2 flex-wrap">
            <a href="/jobs" class="btn btn-success">
                Quản lý Job
            </a>

            <a href="/candidates" class="btn btn-outline-secondary">
                Candidates
            </a>

            <a href="/applications" class="btn btn-outline-secondary">
                Applications
            </a>

            <a href="/public/jobs" class="btn btn-dark">
                Trang ứng tuyển public
            </a>
        </div>

    </div>

</body>

</html>
