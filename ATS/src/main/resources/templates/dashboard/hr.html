<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>HR Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <h2>HR Dashboard</h2>

        <div class="row g-3 mt-3">

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Jobs</h5>
                    <h2 th:text="${stats.totalJobs}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Candidates</h5>
                    <h2 th:text="${stats.totalCandidates}"></h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>Pending Applications</h5>
                    <h2 th:text="${stats.pendingApplications}"></h2>
                </div>
            </div>

        </div>

        <div class="mt-4 d-flex gap-2">
            <a href="/jobs" class="btn btn-primary">Quản lý Job</a>
            <a href="/candidates" class="btn btn-secondary">Candidates</a>
            <a href="/applications" class="btn btn-secondary">Applications</a>
            <a href="/public/jobs" class="btn btn-success">Trang ứng tuyển public</a>
        </div>

    </div>
</body>

</html>
