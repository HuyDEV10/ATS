<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Interviewer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3748;
        }

        .dashboard-wrapper {
            min-height: 100vh;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0d6efd, #5a8dff);
            border-radius: 20px;
            padding: 32px;
            color: white;
            box-shadow: 0 12px 30px rgba(13, 110, 253, 0.18);
        }

        .dashboard-header h2 {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            margin-bottom: 0;
            opacity: 0.9;
        }

        .interview-card {
            margin-top: 24px;
            border: none;
            border-radius: 20px;
            padding: 32px;
            background: white;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
            transition: all 0.25s ease;
        }

        .interview-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.1);
        }

        .interview-card h4 {
            font-weight: 700;
            margin-bottom: 14px;
            color: #0d6efd;
        }

        .interview-card p {
            color: #718096;
            margin-bottom: 24px;
            font-size: 15px;
        }

        .interview-card .btn {
            border-radius: 12px;
            padding: 12px 22px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container py-4 dashboard-wrapper">

        <div class="dashboard-header">
            <h2>Interviewer Dashboard</h2>
            <p>Quản lý lịch phỏng vấn và theo dõi ứng viên được phân công</p>
        </div>

        <div class="card interview-card">

            <h4>Lịch phỏng vấn</h4>

            <p>
                Bạn có thể xem danh sách các buổi phỏng vấn được HR phân công,
                theo dõi lịch trình và chuẩn bị đánh giá ứng viên.
            </p>

            <a href="/interviews/my" class="btn btn-primary">
                Xem lịch phỏng vấn của tôi
            </a>

        </div>

    </div>

</body>

</html>
