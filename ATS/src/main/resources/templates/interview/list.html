<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch phỏng vấn - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .main-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .round-badge {
            width: 32px;
            height: 32px;
            background-color: #e7f1ff;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .score-box {
            font-weight: bold;
            color: #198754;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4 px-4">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1"><i class="bi bi-calendar-check me-2"></i>Lịch trình Phỏng vấn</h2>
                <p th:if="${applicationId}" class="text-muted small">Đang xem lịch của Đơn ứng tuyển: #<span
                        th:text="${applicationId}"></span></p>
            </div>
            <div th:if="${applicationId}">
                <a th:href="@{/interviews/create(applicationId=${applicationId})}" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-lg"></i> Lên lịch phỏng vấn
                </a>
            </div>
        </div>

        <div class="card main-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Vòng</th>
                                <th>Thời gian</th>
                                <th class="text-center">Trạng thái</th>
                                <th class="text-center">Điểm số</th>
                                <th>Đánh giá (Recommendation)</th>
                                <th class="text-center pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="iv : ${interviewPage.records}">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <div class="round-badge me-2" th:text="${iv.round}">1</div>
                                        <small class="text-muted">Round</small>
                                    </div>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark"><i class="bi bi-clock me-1"></i> <span
                                            th:text="${#temporals.format(iv.interviewDate, 'dd/MM/yyyy HH:mm')}"></span>
                                    </div>
                                    <div class="small text-muted" th:text="'App ID: #' + ${iv.applicationId}"></div>
                                </td>
                                <td class="text-center">
                                    <span th:if="${iv.status == 'SCHEDULED'}"
                                        class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3">SCHEDULED</span>
                                    <span th:if="${iv.status == 'COMPLETED'}"
                                        class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3">COMPLETED</span>
                                    <span th:if="${iv.status == 'CANCELLED'}"
                                        class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3">CANCELLED</span>
                                </td>
                                <td class="text-center">
                                    <span th:text="${iv.score != null ? iv.score : '-'}" class="score-box"></span>
                                </td>
                                <td>
                                    <div class="small text-truncate" style="max-width: 250px;"
                                        th:text="${iv.recommendation != null ? iv.recommendation : '-- Chưa có đánh giá --'}">
                                    </div>
                                </td>
                                <td class="text-center pe-4">
                                    <div class="btn-group shadow-sm">
                                        <a th:href="@{/interviews/view/{id}(id=${iv.id})}" class="btn btn-sm btn-light"
                                            title="Chi tiết"><i class="bi bi-eye"></i></a>

                                        <th:block th:if="${iv.status == 'SCHEDULED'}">
                                            <a th:href="@{/interviews/edit/{id}(id=${iv.id})}"
                                                class="btn btn-sm btn-light text-warning" title="Sửa"><i
                                                    class="bi bi-pencil"></i></a>
                                            <a th:href="@{/interviews/cancel/{id}(id=${iv.id})}"
                                                class="btn btn-sm btn-light text-danger" title="Hủy"
                                                onclick="return confirm('Bạn có chắc chắn muốn hủy lịch này?')"><i
                                                    class="bi bi-x-circle"></i></a>
                                        </th:block>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${interviewPage.records.isEmpty()}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-calendar-x display-4 d-block mb-2"></i>
                                    Không có lịch phỏng vấn nào được tìm thấy.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <nav th:if="${interviewPage.pages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:each="i: ${#numbers.sequence(1, interviewPage.pages)}"
                    th:classappend="${i == interviewPage.current} ? 'active'">
                    <a class="page-link"
                        th:href="@{/interviews(page=${i}, size=${interviewPage.size}, applicationId=${applicationId})}"
                        th:text="${i}"></a>
                </li>
            </ul>
        </nav>

        <div class="mt-4 text-center">
            <a href="/applications" class="btn btn-link text-decoration-none">
                <i class="bi bi-arrow-left"></i> Quay lại Đơn ứng tuyển
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
