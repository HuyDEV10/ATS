<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Assign Interviewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <h2>Gán người phỏng vấn</h2>

        <form action="/interviews/create" method="post" class="card p-4">

            <input type="hidden" name="applicationId" th:value="${applicationId}">

            <div class="mb-3">
                <label>Interviewer</label>
                <select name="interviewerId" class="form-select" required>
                    <option th:each="u : ${interviewers}" th:value="${u.id}" th:text="${u.username + ' - ' + u.email}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label>Ngày phỏng vấn</label>
                <input name="interviewDate" type="datetime-local" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Round</label>
                <input name="round" type="number" class="form-control" value="1">
            </div>

            <div class="mb-3">
                <label>Meeting Link</label>
                <input name="meetingLink" class="form-control">
            </div>

            <div class="mb-3">
                <label>Location</label>
                <input name="location" class="form-control" value="Online">
            </div>

            <div class="mb-3">
                <label>Notes</label>
                <textarea name="notes" class="form-control"></textarea>
            </div>

            <button class="btn btn-primary">Tạo lịch phỏng vấn</button>
        </form>

    </div>
</body>

</html>
