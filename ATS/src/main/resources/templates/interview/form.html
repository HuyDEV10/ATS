<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Form - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.04),
                    rgba(13, 202, 240, 0.03)),
                #f4f7fb;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
            min-height: 100vh;
        }

        .main-container {
            max-width: 820px;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .interview-card {
            border: none;
            border-radius: 28px;
            overflow: hidden;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            padding: 40px;
        }

        .form-header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .form-header p {
            margin-bottom: 0;
            opacity: 0.92;
        }

        .form-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select {
            min-height: 50px;
            border-radius: 14px;
            border: 1px solid #dbe2ea;
            transition: all 0.2s ease;
        }

        textarea.form-control {
            min-height: 120px;
            padding-top: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .input-group-text {
            border-radius: 14px 0 0 14px;
            border: 1px solid #dbe2ea;
            background: #f8fafc;
            color: #0d6efd;
            font-size: 18px;
        }

        .btn {
            border-radius: 14px;
            font-weight: 700;
            padding: 12px 22px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            border: none;
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(13, 110, 253, 0.22);
        }

        .back-link {
            font-weight: 700;
            color: #64748b;
            text-decoration: none;
        }

        .back-link:hover {
            color: #0d6efd;
        }

        @media (max-width: 768px) {

            .form-header,
            .form-body {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container main-container">

        <div class="card interview-card">

            <div class="form-header">

                <h1 th:if="${interview.id == null}">
                    <i class="bi bi-calendar-plus me-2"></i>
                    Schedule Interview
                </h1>

                <h1 th:if="${interview.id != null}">
                    <i class="bi bi-clipboard-check me-2"></i>
                    Edit Interview Result
                </h1>

                <p>
                    Quản lý lịch phỏng vấn, kết quả đánh giá và đề xuất tuyển dụng.
                </p>

            </div>

            <div class="form-body">

                <form th:action="@{/interviews/create}" th:method="post" th:object="${interview}"
                    th:unless="${interview.id}">

                    <input type="hidden" th:field="*{applicationId}" />

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Round
                                <span class="text-danger">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-layers"></i>
                                </span>

                                <input type="number" th:field="*{round}" class="form-control" placeholder="Ví dụ: 1"
                                    required />

                            </div>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Interview Date
                                <span class="text-danger">*</span>
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-calendar-event"></i>
                                </span>

                                <input type="datetime-local" th:field="*{interviewDate}" class="form-control"
                                    required />

                            </div>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Location
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-geo-alt"></i>
                                </span>

                                <input type="text" th:field="*{location}" class="form-control"
                                    placeholder="Phòng họp / Địa điểm phỏng vấn" />

                            </div>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Meeting Link
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-camera-video"></i>
                                </span>

                                <input type="text" th:field="*{meetingLink}" class="form-control"
                                    placeholder="Google Meet / Zoom link" />

                            </div>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Notes
                            </label>

                            <textarea th:field="*{notes}" class="form-control"
                                placeholder="Ghi chú lịch phỏng vấn, yêu cầu chuẩn bị..."></textarea>

                        </div>

                    </div>

                    <div class="d-grid gap-3 d-md-flex justify-content-md-end">

                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">

                            Back

                        </a>

                        <button type="submit" class="btn btn-primary px-5">

                            <i class="bi bi-calendar-check me-1"></i>
                            Schedule

                        </button>

                    </div>

                </form>

                <form th:action="@{/interviews/edit/{id}(id=${interview.id})}" th:method="post" th:object="${interview}"
                    th:if="${interview.id}">

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select th:field="*{status}" class="form-select">

                                <option value="SCHEDULED">
                                    Scheduled
                                </option>

                                <option value="COMPLETED">
                                    Completed
                                </option>

                                <option value="CANCELLED">
                                    Cancelled
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Score (0-10)
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-star"></i>
                                </span>

                                <input type="number" step="1" th:field="*{score}" class="form-control"
                                    placeholder="0 - 10" />

                            </div>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Feedback
                            </label>

                            <textarea th:field="*{feedback}" class="form-control"
                                placeholder="Nhận xét sau phỏng vấn..."></textarea>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Recommendation
                            </label>

                            <select th:field="*{recommendation}" class="form-select">

                                <option value="">
                                    -- Select --
                                </option>

                                <option value="RECOMMEND">
                                    Recommend
                                </option>

                                <option value="POTENTIAL">
                                    Potential
                                </option>

                                <option value="REJECT">
                                    Reject
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="d-grid gap-3 d-md-flex justify-content-md-end">

                        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">

                            Back

                        </a>

                        <button type="submit" class="btn btn-primary px-5">

                            <i class="bi bi-check2-circle me-1"></i>
                            Update

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
