<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Interview Form</title>
</head>

<body>
    <h1 th:if="${interview.id == null}">Schedule Interview</h1>
    <h1 th:if="${interview.id != null}">Edit Interview Result</h1>

    <form th:action="@{/interviews/create}" th:method="post" th:object="${interview}" th:unless="${interview.id}">
        <input type="hidden" th:field="*{applicationId}" />
        <label>Round: <input type="number" th:field="*{round}" required /></label><br />
        <label>Interview Date: <input type="datetime-local" th:field="*{interviewDate}" required /></label><br />
        <label>Location: <input type="text" th:field="*{location}" /></label><br />
        <label>Meeting Link: <input type="text" th:field="*{meetingLink}" /></label><br />
        <label>Notes: <textarea th:field="*{notes}"></textarea></label><br />
        <button type="submit">Schedule</button>
    </form>

    <form th:action="@{/interviews/edit/{id}(id=${interview.id})}" th:method="post" th:object="${interview}"
        th:if="${interview.id}">
        <label>Status:
            <select th:field="*{status}">
                <option value="SCHEDULED">Scheduled</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
        </label><br />
        <label>Feedback: <textarea th:field="*{feedback}"></textarea></label><br />
        <label>Score (0-10): <input type="number" step="1" th:field="*{score}" /></label><br />
        <label>Recommendation:
            <select th:field="*{recommendation}">
                <option value="">-- Select --</option>
                <option value="RECOMMEND">Recommend</option>
                <option value="POTENTIAL">Potential</option>
                <option value="REJECT">Reject</option>
            </select>
        </label><br />
        <button type="submit">Update</button>
    </form>

    <p><a href="javascript:history.back()">Back</a></p>
</body>

</html>
