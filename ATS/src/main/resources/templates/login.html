<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.08),
                    rgba(13, 202, 240, 0.08)),
                #f4f7fb;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1050px;
            display: grid;
            grid-template-columns: 1fr 420px;
            overflow: hidden;
            border-radius: 24px;
            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .login-banner {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-banner h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .login-banner p {
            font-size: 16px;
            line-height: 1.8;
            opacity: 0.95;
            margin-bottom: 0;
        }

        .login-card {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .btn-login {
            height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            font-weight: 700;
            font-size: 15px;
            transition: all 0.25s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.25);
        }

        .register-link {
            color: #0d6efd;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            border: none;
        }

        @media (max-width: 900px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .login-banner {
                display: none;
            }

            .login-card {
                padding: 40px 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-banner">
            <h1>SmartATS</h1>

            <p>
                Hệ thống quản lý tuyển dụng thông minh giúp doanh nghiệp
                tối ưu quy trình tuyển dụng, quản lý ứng viên và theo dõi
                phỏng vấn một cách chuyên nghiệp.
            </p>
        </div>

        <div class="login-card">

            <h2 class="login-title">Đăng nhập</h2>

            <p class="login-subtitle">
                Chào mừng bạn quay trở lại hệ thống SmartATS
            </p>

            <div th:if="${param.error}" class="alert alert-danger p-3 small text-center mb-4">
                Sai tên đăng nhập hoặc mật khẩu!
            </div>

            <form th:action="@{/auth/doLogin}" method="post">

                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>

                    <input type="text" name="username" class="form-control" placeholder="Nhập username..." required />
                </div>

                <div class="mb-4">
                    <label class="form-label">Mật khẩu</label>

                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..."
                        required />
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100">
                    Đăng nhập
                </button>

            </form>

            <div class="text-center mt-4">
                <p class="small mb-0">
                    Chưa có tài khoản?

                    <a th:href="@{/auth/register}" class="register-link">
                        Đăng ký ngay
                    </a>
                </p>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
