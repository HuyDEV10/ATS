<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .btn-login {
            background-color: #0d6efd;
            border: none;
            padding: 10px;
            font-weight: 600;
        }

        .btn-login:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2 class="text-center mb-4 fw-bold">Đăng nhập</h2>

        <div th:if="${param.error}" class="alert alert-danger p-2 small mb-3 text-center">
            Sai tên đăng nhập hoặc mật khẩu!
        </div>

        <form th:action="@{/auth/doLogin}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required />
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required />
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100">Đăng nhập</button>
        </form>

        <div class="text-center mt-4">
            <p class="small mb-0">Chưa có tài khoản?
                <a th:href="@{/auth/register}" class="text-decoration-none fw-bold">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
