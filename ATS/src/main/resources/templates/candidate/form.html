<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Form - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.04),
                    rgba(13, 202, 240, 0.03)),
                #f4f7fb;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        .candidate-card {
            border: none;
            border-radius: 28px;
            overflow: hidden;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            padding: 40px;
        }

        .card-header-custom h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .card-header-custom p {
            margin-bottom: 0;
            opacity: 0.92;
            font-size: 15px;
        }

        .card-body {
            padding: 40px;
        }

        .form-label {
            font-weight: 700;
            color: #334155;
            margin-bottom: 10px;
        }

        .form-control,
        .form-select {
            min-height: 50px;
            border-radius: 14px;
            border: 1px solid #dbe2ea;
            transition: all 0.2s ease;
        }

        textarea.form-control {
            min-height: 120px;
            padding-top: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .input-group-text {
            border-radius: 14px 0 0 14px;
            border: 1px solid #dbe2ea;
            background: #f8fafc;
            color: #0d6efd;
            font-size: 18px;
        }

        .form-text {
            font-size: 13px;
            margin-top: 8px;
        }

        .btn {
            border-radius: 14px;
            font-weight: 700;
            padding: 12px 22px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            border: none;
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(13, 110, 253, 0.22);
        }

        .btn-outline-secondary {
            border-width: 1px;
        }

        @media (max-width: 768px) {

            .card-header-custom,
            .card-body {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card candidate-card">

            <div class="card-header-custom">

                <h2>

                    <i class="bi bi-person-plus-fill me-2"></i>

                    <span th:if="${candidate.id == null}">
                        Tạo Hồ Sơ Ứng Viên
                    </span>

                    <span th:if="${candidate.id != null}">
                        Chỉnh Sửa Hồ Sơ
                    </span>

                </h2>

                <p>
                    Quản lý thông tin ứng viên và dữ liệu tuyển dụng
                    trên hệ thống SmartATS.
                </p>

            </div>

            <div class="card-body">

                <form th:action="${candidate.id == null ? '/candidates/create' : '/candidates/edit/' + candidate.id}"
                    th:method="post" th:object="${candidate}">

                    <div class="row">

                        <!-- Name -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Họ và tên
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person"></i>

                                </span>

                                <input type="text" th:field="*{name}" class="form-control" placeholder="Nguyễn Văn A"
                                    required />

                            </div>

                        </div>

                        <!-- Email -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Email
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-envelope"></i>

                                </span>

                                <input type="email" th:field="*{email}" class="form-control"
                                    placeholder="example@gmail.com" required />

                            </div>

                        </div>

                        <!-- Phone -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-telephone"></i>

                                </span>

                                <input type="text" th:field="*{phone}" class="form-control" placeholder="0905..." />

                            </div>

                        </div>

                        <!-- Experience -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Số năm kinh nghiệm
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-briefcase"></i>

                                </span>

                                <input type="number" th:field="*{experienceYears}" class="form-control"
                                    placeholder="Ví dụ: 2" />

                            </div>

                        </div>

                        <!-- Source -->

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Nguồn ứng viên
                            </label>

                            <select th:field="*{source}" class="form-select">

                                <option value="manual">
                                    Manual (Nhập tay)
                                </option>

                                <option value="upload">
                                    Upload (Tải lên)
                                </option>

                                <option value="import">
                                    Import (Nhập file)
                                </option>

                            </select>

                        </div>

                        <!-- Skills -->

                        <div class="col-12 mb-4">

                            <label class="form-label">
                                Kỹ năng chuyên môn
                            </label>

                            <textarea th:field="*{skills}" class="form-control" rows="3"
                                placeholder="Ví dụ: Java, Spring Boot, ReactJS... (Cách nhau bằng dấu phẩy)"></textarea>

                            <div class="form-text">

                                Mẹo: Hãy liệt kê các kỹ năng chính để AI dễ dàng phân loại.

                            </div>

                        </div>

                    </div>

                    <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-3">

                        <a href="/candidates" class="btn btn-outline-secondary px-4">

                            Quay lại

                        </a>

                        <button type="submit" class="btn btn-primary px-5 shadow-sm">

                            <span th:text="${candidate.id == null ? 'Lưu Hồ Sơ' : 'Cập Nhật Hồ Sơ'}">
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
