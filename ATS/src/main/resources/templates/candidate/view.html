<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết ứng viên - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f0f2f5;
        }

        .profile-header {
            background: #ffffff;
            border-radius: 15px 15px 0 0;
            border-bottom: 1px solid #eee;
        }

        .avatar-circle {
            width: 80px;
            height: 80px;
            background-color: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50%;
        }

        .info-card {
            border: none;
            border-radius: 15px;
        }

        .label-custom {
            color: #6c757d;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .value-custom {
            color: #212529;
            font-weight: 500;
            margin-bottom: 1.2rem;
        }

        .skill-tag {
            display: inline-block;
            background: #e7f1ff;
            color: #0d6efd;
            padding: 5px 15px;
            border-radius: 50px;
            margin: 0 5px 5px 0;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="/candidates" class="btn btn-link text-decoration-none p-0 text-muted">
                        <i class="bi bi-arrow-left"></i> Quay lại danh sách
                    </a>
                    <div class="btn-group shadow-sm">
                        <a th:href="@{/candidates/edit/{id}(id=${candidate.id})}" class="btn btn-warning btn-sm px-3">
                            <i class="bi bi-pencil-square"></i> Sửa hồ sơ
                        </a>
                    </div>
                </div>

                <div class="card info-card shadow-sm">
                    <div class="profile-header p-4 p-md-5">
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle shadow-sm me-4">
                                <span th:text="${#strings.substring(candidate.name,0,1)}">A</span>
                            </div>
                            <div>
                                <h1 class="h2 fw-bold mb-1" th:text="${candidate.name}">Candidate Name</h1>
                                <p class="text-muted mb-0">
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle"
                                        th:text="${candidate.experienceYears + ' năm kinh nghiệm'}">0 years</span>
                                    <span class="ms-2 small"><i class="bi bi-info-circle"></i> Nguồn: <span
                                            th:text="${candidate.source}">Source</span></span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white rounded-bottom">
                        <div class="row">
                            <div class="col-md-6 border-end">
                                <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-person-lines-fill me-2"></i>Thông tin
                                    liên hệ</h5>

                                <div class="label-custom">Email cá nhân</div>
                                <div class="value-custom"><i class="bi bi-envelope text-muted me-2"></i> <span
                                        th:text="${candidate.email}">email@example.com</span></div>

                                <div class="label-custom">Số điện thoại</div>
                                <div class="value-custom"><i class="bi bi-telephone text-muted me-2"></i> <span
                                        th:text="${candidate.phone}">N/A</span></div>

                                <div class="label-custom">Mã định danh hệ thống (ID)</div>
                                <div class="value-custom">#<span th:text="${candidate.id}">1</span></div>
                            </div>

                            <div class="col-md-6 ps-md-4">
                                <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-stars me-2"></i>Kỹ năng</h5>
                                <div class="mb-4">
                                    <div th:text="${candidate.skills}" class="text-muted italic">Kỹ năng chưa cập nhật
                                    </div>
                                </div>

                                <h5 class="fw-bold mb-3 text-dark small text-uppercase">Thông tin hệ thống</h5>
                                <div class="label-custom">Người tạo hồ sơ</div>
                                <div class="value-custom small text-muted"><i class="bi bi-person-check me-1"></i> <span
                                        th:text="${candidate.createdBy}">Admin</span></div>

                                <div class="label-custom">Thời gian tạo</div>
                                <div class="value-custom small text-muted"><i class="bi bi-clock me-1"></i> <span
                                        th:text="${#temporals.format(candidate.createTime, 'dd/MM/yyyy HH:mm')}">Time</span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-5 pt-4 border-top text-center">
                            <button class="btn btn-outline-primary" onclick="window.print()">
                                <i class="bi bi-download me-1"></i> Tải hồ sơ (PDF)
                                </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
