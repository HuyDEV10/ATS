<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh sách ứng viên - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background:
                linear-gradient(135deg,
                    rgba(13, 110, 253, 0.04),
                    rgba(13, 202, 240, 0.03)),
                #f4f7fb;

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }

        .main-card {
            border: none;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
        }

        .card-body {
            padding: 36px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #64748b;
            margin-bottom: 0;
        }

        .btn {
            border-radius: 14px;
            font-weight: 700;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .search-box .form-control {
            border-radius: 14px 0 0 14px;
            min-height: 48px;
            border: 1px solid #dbe2ea;
            border-right: none;
        }

        .search-box .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }

        .search-box .btn {
            border-radius: 0 14px 14px 0;
            border-left: none;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: #f8fafc;
        }

        .table thead th {
            border: none;
            color: #64748b;
            font-size: 13px;
            font-weight: 800;
            padding-top: 18px;
            padding-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding-top: 18px;
            padding-bottom: 18px;
            border-color: #f1f5f9;
            vertical-align: middle;
        }

        .table-hover tbody tr:hover {
            background-color: #f8fbff;
        }

        .candidate-name {
            font-weight: 700;
            font-size: 15px;
            color: #1e293b;
        }

        .candidate-email {
            color: #64748b;
            font-size: 13px;
        }

        .skill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-badge {
            background: #eef4ff;
            color: #0d6efd;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
        }

        .experience-badge {
            background: #f8fafc;
            border: 1px solid #dbe2ea;
            color: #334155;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #334155;
        }

        .source-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .action-buttons .btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .pagination .page-link {
            border: none;
            margin: 0 4px;
            border-radius: 10px;
            min-width: 40px;
            text-align: center;
            color: #0d6efd;
        }

        .pagination .active .page-link {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
        }

        .empty-state {
            padding: 60px 20px;
        }

        .empty-state i {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container-fluid py-4 px-4">

        <!-- Alerts -->

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">

            <i class="bi bi-check-circle-fill me-2"></i>

            <span th:text="${success}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert">
            </button>

        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">

            <i class="bi bi-exclamation-triangle-fill me-2"></i>

            <span th:text="${error}"></span>

            <button type="button" class="btn-close" data-bs-dismiss="alert">
            </button>

        </div>

        <!-- Main Card -->

        <div class="card main-card">

            <div class="card-body">

                <!-- Header -->

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                    <div>

                        <h2 class="page-title">
                            Hồ sơ Ứng viên
                        </h2>

                        <p class="page-subtitle">
                            Quản lý và theo dõi danh sách ứng viên trong hệ thống SmartATS
                        </p>

                    </div>

                    <a href="/candidates/create" class="btn btn-primary px-4 py-2 shadow-sm">

                        <i class="bi bi-person-plus me-1"></i>

                        Thêm ứng viên

                    </a>

                </div>

                <!-- Search -->

                <div class="row g-3 mb-4">

                    <div class="col-md-5">

                        <form method="get" class="input-group search-box">

                            <input type="text" name="keyword" class="form-control" th:value="${keyword}"
                                placeholder="Tìm tên, email, kỹ năng..." />

                            <button class="btn btn-outline-secondary bg-white text-muted" type="submit">

                                <i class="bi bi-search"></i>

                            </button>

                        </form>

                    </div>

                    <div class="col-md-7 text-md-end">

                        <a href="/jobs" class="btn btn-outline-dark px-4 py-2">

                            <i class="bi bi-briefcase me-1"></i>

                            Quản lý Jobs

                        </a>

                    </div>

                </div>

                <!-- Table -->

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Ứng viên</th>

                                <th>Liên hệ</th>

                                <th>Kỹ năng</th>

                                <th class="text-center">Kinh nghiệm</th>

                                <th>Nguồn</th>

                                <th class="text-center">Thao tác</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="c : ${candidatePage.records}">

                                <td class="text-muted small" th:text="${c.id}">
                                    1
                                </td>

                                <td>

                                    <div class="candidate-name" th:text="${c.name}">
                                        Name
                                    </div>

                                    <div class="candidate-email" th:text="${c.email}">
                                        email@test.com
                                    </div>

                                </td>

                                <td th:text="${c.phone}">
                                    090...
                                </td>

                                <td>

                                    <div class="skill-container">

                                        <span class="skill-badge" th:text="${c.skills}">
                                        </span>

                                    </div>

                                </td>

                                <td class="text-center">

                                    <span class="experience-badge" th:text="${c.experienceYears + ' năm'}">

                                        0 năm

                                    </span>

                                </td>

                                <td>

                                    <span th:switch="${c.source}" class="source-tag">

                                        <span th:case="'manual'">

                                            <span class="source-indicator bg-info"></span>

                                            Manual

                                        </span>

                                        <span th:case="'upload'">

                                            <span class="source-indicator bg-success"></span>

                                            Upload

                                        </span>

                                        <span th:case="'import'">

                                            <span class="source-indicator bg-warning"></span>

                                            Import

                                        </span>

                                        <span th:case="*">

                                            <span class="source-indicator bg-secondary"></span>

                                            [[${c.source}]]

                                        </span>

                                    </span>

                                </td>

                                <td class="text-center">

                                    <div class="btn-group action-buttons">

                                        <a th:href="@{/candidates/view/{id}(id=${c.id})}"
                                            class="btn btn-sm btn-outline-primary" title="Xem chi tiết">

                                            <i class="bi bi-eye"></i>

                                        </a>

                                        <a th:href="@{/candidates/edit/{id}(id=${c.id})}"
                                            class="btn btn-sm btn-outline-warning" title="Sửa">

                                            <i class="bi bi-pencil"></i>

                                        </a>

                                        <a th:href="@{/candidates/delete/{id}(id=${c.id})}"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Xóa ứng viên này?')" title="Xóa">

                                            <i class="bi bi-trash"></i>

                                        </a>

                                    </div>

                                </td>

                            </tr>

                            <!-- Empty -->

                            <tr th:if="${candidatePage.records.isEmpty()}">

                                <td colspan="7" class="text-center empty-state text-muted">

                                    <i class="bi bi-people display-4 d-block mb-3"></i>

                                    Không tìm thấy ứng viên nào.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- Pagination -->

                <nav th:if="${candidatePage.pages > 1}" class="mt-4">

                    <ul class="pagination pagination-sm justify-content-center">

                        <li class="page-item" th:each="i: ${#numbers.sequence(1, candidatePage.pages)}"
                            th:classappend="${i == candidatePage.current} ? 'active'">

                            <a class="page-link"
                                th:href="@{/candidates(page=${i}, size=${candidatePage.size}, keyword=${keyword})}"
                                th:text="${i}">
                            </a>

                        </li>

                    </ul>

                </nav>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
