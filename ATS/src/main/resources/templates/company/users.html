<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Team Members - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .hero {
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            color: #fff;
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .card-soft {
            border: 0;
            border-radius: 24px;
            box-shadow: 0 14px 40px rgba(88, 28, 135, 0.08);
        }

        .role-badge {
            border-radius: 999px;
            padding: 6px 12px;
            font-weight: 700;
            font-size: 13px;
        }

        .filter-card {
            border: 0;
            border-radius: 20px;
            box-shadow: 0 10px 26px rgba(88, 28, 135, 0.06);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="page-shell">

        <section class="hero">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="fw-bold mb-2">Team Members</h2>
                    <p class="mb-0">
                        Quản lý các tài khoản thuộc công ty: HR, Interviewer và Viewer.
                    </p>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/dashboard/company-owner}" class="btn btn-outline-light rounded-pill px-4">
                        Dashboard
                    </a>

                    <a th:href="@{/company/profile}" class="btn btn-outline-light rounded-pill px-4">
                        Company Profile
                    </a>

                    <a th:href="@{/company/users/create}" class="btn btn-light rounded-pill px-4 fw-bold">
                        + Add Member
                    </a>
                </div>
            </div>
        </section>

        <div th:if="${success}" class="alert alert-success rounded-4" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>

        <div class="card filter-card">
            <div class="card-body p-4">
                <form method="get" th:action="@{/company/users}" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Search</label>
                        <input class="form-control" name="keyword" placeholder="Username, full name, email, phone"
                            th:value="${keyword}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Role</label>
                        <select class="form-select" name="role">
                            <option value="">All roles</option>
                            <option value="HR" th:selected="${role == 'HR'}">HR</option>
                            <option value="INTERVIEWER" th:selected="${role == 'INTERVIEWER'}">INTERVIEWER</option>
                            <option value="VIEWER" th:selected="${role == 'VIEWER'}">VIEWER</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Status</label>
                        <select class="form-select" name="status">
                            <option value="">All status</option>
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
                            <option value="LOCKED" th:selected="${status == 'LOCKED'}">LOCKED</option>
                            <option value="INVITED" th:selected="${status == 'INVITED'}">INVITED</option>
                            <option value="PENDING" th:selected="${status == 'PENDING'}">PENDING</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-primary w-100 rounded-pill" type="submit">
                            Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card card-soft">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Member</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th style="width: 260px;">Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="user : ${userPage.records}">
                                <td th:text="${user.id}">1</td>

                                <td>
                                    <div class="fw-bold"
                                        th:text="${user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : user.username}">
                                        Full Name
                                    </div>

                                    <div class="small text-muted" th:text="${user.username}">
                                        username
                                    </div>
                                </td>

                                <td th:text="${user.email}">email</td>
                                <td th:text="${user.phone}">phone</td>

                                <td>
                                    <span class="badge bg-primary role-badge" th:text="${user.role}">
                                        HR
                                    </span>
                                </td>

                                <td>
                                    <span th:if="${user.status == 'ACTIVE'}" class="badge bg-success role-badge"
                                        th:text="${user.status}">
                                        ACTIVE
                                    </span>

                                    <span th:if="${user.status == 'LOCKED'}" class="badge bg-danger role-badge"
                                        th:text="${user.status}">
                                        LOCKED
                                    </span>

                                    <span th:if="${user.status != 'ACTIVE' and user.status != 'LOCKED'}"
                                        class="badge bg-secondary role-badge" th:text="${user.status}">
                                        OTHER
                                    </span>
                                </td>

                                <td>
                                    <div class="d-flex flex-wrap gap-2">
                                        <form th:if="${user.status != 'LOCKED'}"
                                            th:action="@{'/company/users/lock/' + ${user.id}}" method="post"
                                            onsubmit="return confirm('Lock this member?');">
                                            <button class="btn btn-sm btn-outline-warning" type="submit">
                                                Lock
                                            </button>
                                        </form>

                                        <form th:if="${user.status == 'LOCKED'}"
                                            th:action="@{'/company/users/unlock/' + ${user.id}}" method="post">
                                            <button class="btn btn-sm btn-outline-success" type="submit">
                                                Unlock
                                            </button>
                                        </form>

                                        <form th:action="@{'/company/users/delete/' + ${user.id}}" method="post"
                                            onsubmit="return confirm('Delete this member?');">
                                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                                Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${userPage == null or #lists.isEmpty(userPage.records)}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    Chưa có thành viên nào trong công ty.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:if="${userPage != null}" class="d-flex justify-content-between align-items-center mt-3">
                    <div class="text-muted">
                        Page
                        <span th:text="${userPage.current}">1</span>
                        /
                        <span th:text="${userPage.pages}">1</span>
                    </div>

                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary btn-sm" th:if="${userPage.current > 1}"
                            th:href="@{/company/users(page=${userPage.current - 1}, keyword=${keyword}, role=${role}, status=${status})}">
                            Previous
                        </a>

                        <a class="btn btn-outline-secondary btn-sm" th:if="${userPage.current < userPage.pages}"
                            th:href="@{/company/users(page=${userPage.current + 1}, keyword=${keyword}, role=${role}, status=${status})}">
                            Next
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
