<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Company Profile - SmartATS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .profile-hero {
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            color: #fff;
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .profile-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 14px 40px rgba(88, 28, 135, 0.08);
        }

        .logo-preview {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: #ede9fe;
            display: grid;
            place-items: center;
            overflow: hidden;
            font-size: 36px;
        }

        .logo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        label {
            font-weight: 700;
            color: #374151;
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <div class="profile-hero">
            <div class="d-flex justify-content-between align-items-center gap-3">
                <div>
                    <h2 class="fw-bold mb-2">Company Profile</h2>
                    <p class="mb-0">
                        Cập nhật thông tin công ty để hiển thị trong hệ thống tuyển dụng.
                    </p>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/company/users}" class="btn btn-outline-light rounded-pill px-4 fw-bold">
                        Manage Users
                    </a>

                    <a th:href="@{/dashboard/company-owner}" class="btn btn-light rounded-pill px-4 fw-bold">
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success rounded-4" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>

        <form method="post" th:action="@{/company/profile}" th:object="${company}" class="card profile-card">
            <div class="card-body p-4 p-lg-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="logo-preview">
                        <img th:if="${company.logoUrl != null and !#strings.isEmpty(company.logoUrl)}"
                            th:src="${company.logoUrl}" alt="Company logo">

                        <span th:if="${company.logoUrl == null or #strings.isEmpty(company.logoUrl)}">
                            🏢
                        </span>
                    </div>

                    <div>
                        <h4 class="mb-1" th:text="${company.name} ?: 'Company Name'">
                            Company Name
                        </h4>

                        <p class="text-muted mb-0" th:text="${company.industry} ?: 'Industry'">
                            Industry
                        </p>

                        <span class="badge bg-success mt-2" th:text="${company.status}">
                            ACTIVE
                        </span>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label">1. Company Name</label>
                        <input class="form-control form-control-lg" th:field="*{name}" placeholder="SmartATS Company"
                            required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">2. Logo URL</label>
                        <input class="form-control form-control-lg" th:field="*{logoUrl}" placeholder="https://...">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">3. Industry</label>
                        <input class="form-control form-control-lg" th:field="*{industry}"
                            placeholder="Information Technology">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">4. Company Size</label>
                        <select class="form-select form-select-lg" th:field="*{companySize}">
                            <option value="">Select size</option>
                            <option value="1-10">1-10</option>
                            <option value="11-50">11-50</option>
                            <option value="51-200">51-200</option>
                            <option value="201-500">201-500</option>
                            <option value="500+">500+</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">5. Website</label>
                        <input class="form-control form-control-lg" th:field="*{website}"
                            placeholder="https://company.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">6. Address</label>
                        <input class="form-control form-control-lg" th:field="*{address}"
                            placeholder="Da Nang, Vietnam">
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button class="btn btn-primary btn-lg rounded-pill px-5" type="submit">
                        Save Company Profile
                    </button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
