<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Team Member - SmartATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f3ff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 16px;
        }

        .form-card {
            border: 0;
            border-radius: 28px;
            box-shadow: 0 14px 40px rgba(88, 28, 135, 0.08);
        }

        label {
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="page-shell">

        <div class="mb-4">
            <a th:href="@{/company/users}" class="text-decoration-none">
                ← Back to team members
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success rounded-4" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger rounded-4" th:text="${error}"></div>

        <div class="card form-card">
            <div class="card-body p-4 p-lg-5">
                <h2 class="fw-bold mb-2">Add Team Member</h2>

                <p class="text-muted mb-4">
                    Tạo tài khoản HR, Interviewer hoặc Viewer thuộc công ty hiện tại.
                </p>

                <form th:action="@{/company/users/create}" method="post" th:object="${request}">

                    <div class="mb-3">
                        <label class="form-label">Full name</label>
                        <input th:field="*{fullName}" class="form-control form-control-lg" placeholder="Nguyễn Văn A">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input th:field="*{username}" class="form-control form-control-lg" placeholder="hr01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" th:field="*{email}" class="form-control form-control-lg"
                            placeholder="hr@company.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input th:field="*{phone}" class="form-control form-control-lg" placeholder="090xxxxxxx">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" th:field="*{password}" class="form-control form-control-lg" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Role *</label>

                        <select th:field="*{role}" class="form-select form-select-lg" required>
                            <option value="">Select role</option>
                            <option value="HR">HR</option>
                            <option value="INTERVIEWER">INTERVIEWER</option>
                            <option value="VIEWER">VIEWER</option>
                        </select>
                    </div>

                    <div class="alert alert-info rounded-4">
                        <strong>Lưu ý:</strong>
                        Người dùng được tạo ở đây sẽ tự động thuộc công ty hiện tại và có trạng thái ACTIVE.
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/company/users}" class="btn btn-outline-secondary rounded-pill px-4">
                            Cancel
                        </a>

                        <button class="btn btn-primary rounded-pill px-4" type="submit">
                            Create Member
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
